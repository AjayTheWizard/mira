services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mira-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:root@postgres:5432/mira
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_SECRET: VtWuWXPzNPFbu+3yo76KbuHhrKTw0HAYkRITjfJubtE=
      NEXT_PUBLIC_LOCATIONIQ_API_KEY: pk.d00e370060722630cc5d811fd4ed4fbd
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: mira-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: mira
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
